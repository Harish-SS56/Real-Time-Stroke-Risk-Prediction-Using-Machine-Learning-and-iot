<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>Stroke Prediction</title>
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <link href="../static/styles.css" rel="stylesheet" type="text/css" />
  <script type="text/javascript" src="../static/js/cufon-yui.js"></script>
  <script type="text/javascript" src="../static/js/arial.js"></script>
  <script type="text/javascript" src="../static/js/cuf_run.js"></script>
  <style type="text/css">
    .style10 {font-size: large; font-weight: bold;}
    .msg {color: red; font-weight: bold;}
    .readonly-box {background-color: #f0f0f0;}
  </style>
</head>
<body>
<div class="main">
  <div class="header">
    <div class="header_resize">
     

      <div class="clr"></div>
    </div>
  </div>
  <div class="hbg">&nbsp;</div>
  <div class="content">
    <div class="content_resize">
      <div class="mainbar">
        <div class="article">
          <h2 align="center"><span>Stroke Prediction</span></h2>
          <p>&nbsp;</p>
          <form action="{{ url_for('predict') }}" method="post">
            <div align="center">
              <table width="500" border="0">
                <tr>
                  <td><span class="style10">Gender</span></td>
                  <td>
                    <select name="s1" id="s1">
                      <option value="0">Male</option>
                      <option value="1">Female</option>
                    </select>
                  </td>
                </tr>
                <tr>
                  <td><span class="style10">Age</span></td>
                  <td><input name="s2" type="text" placeholder="Enter age" class="textbox"/></td>
                </tr>
                <tr>
                  <td><span class="style10">Hypertension</span></td>
                  <td>
                    <select name="s3" id="s3">
                      <option value="1">Yes</option>
                      <option value="0">No</option>
                    </select>
                  </td>
                </tr>
                <tr>
                  <td><span class="style10">Heart disease</span></td>
                  <td>
                    <select name="s4" id="s4">
                      <option value="1">Yes</option>
                      <option value="0">No</option>
                    </select>
                  </td>
                </tr>
                <tr>
                  <td><span class="style10">Marital status</span></td>
                  <td>
                    <select name="s5" id="s5">
                      <option value="1">Yes</option>
                      <option value="0">No</option>
                    </select>
                  </td>
                </tr>
                <tr>
                  <td><span class="style10">Work type</span></td>
                  <td>
                    <select name="s6" id="s6">
                      <option value="0">Private</option>
                      <option value="1">Self-employed</option>
                      <option value="2">Govt_job</option>
                    </select>
                  </td>
                </tr>
                <tr>
                  <td><span class="style10">Residence type</span></td>
                  <td>
                    <select name="s7" id="s7">
                      <option value="0">Urban</option>
                      <option value="1">Rural</option>
                    </select>
                  </td>
                </tr>
                <tr>
                  <td><span class="style10">Avg glucose level</span></td>
                  <td><input name="s8" type="text" placeholder="Enter glucose level" class="textbox"/></td>
                </tr>
                <tr>
                  <td><span class="style10">BMI</span></td>
                  <td><input name="s9" type="text" placeholder="Enter BMI" class="textbox"/></td>
                </tr>
                <tr>
                  <td><span class="style10">Smoking status</span></td>
                  <td>
                    <select name="s10" id="s10">
                      <option value="0">formerly smoked</option>
                      <option value="1">never smoked</option>
                      <option value="2">smokes</option>
                      <option value="3">Unknown</option>
                    </select>
                  </td>
                </tr>

                <!-- 💓 Heart Rate from NodeMCU -->
                <tr>
                  <td><span class="style10">Heart Rate</span></td>
                  <td>
                    <input name="heart_rate" type="text"  value="{{ hr_val }}"/>
                  </td>
                </tr>

                <!-- 🩸 SpO2 from NodeMCU -->
                <tr>
                  <td><span class="style10">SpO₂ (%)</span></td>
                  <td>
                    <input name="spo2" type="text"  value="{{ spo2_val }}"/>
                  </td>
                </tr>

                <!-- 📧 Email -->
                <tr>
                  <td><span class="style10">Email ID</span></td>
                  <td><input name="emailid" type="text" /></td>
                </tr>

                <tr>
                  <td colspan="2" align="center">
                    <input type="submit" class="btn" value="Predict" />
                  </td>
                </tr>
                <tr>
                  <td colspan="2">
                    <div align="center" class="msg">{{ msg }}</div>
                  </td>
                </tr>
              </table>
            </div>
          </form>
          <p align="center">&nbsp;</p>
        </div>
      </div>

      <div class="clr"></div>
    </div>
  </div>

  <div class="fbg">
    <div class="fbg_resize"><div class="clr"></div></div>
  </div>
  <div class="footer">
    <div class="footer_resize"><div class="clr"></div></div>
  </div>
</div>
<div align="center"></div>
</body>
</html>
